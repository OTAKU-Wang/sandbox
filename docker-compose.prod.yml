services:
  # A283: 本文件所有密钥一律用 VAR:?说明 这种 fail-closed 插值形式（前面带美元符）—— compose 对未定义变量只 warn 并替换成空串，
  # 于是 Postgres 会以空密码起来并对外发布端口（API 侧 validate_security_config 只在应用
  # 启动时兜底，数据层已经先起来了）。required 插值让 `compose up` 在解析阶段就失败。

  # ─── 数据库层 ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cds
      POSTGRES_USER: cds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - empty boots Postgres with no password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cds"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - empty boots Redis open} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql
    environment:
      CLICKHOUSE_DB: cds_audit
      CLICKHOUSE_USER: cds
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required - empty disables audit-store auth}

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - object-store root credential}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 策略引擎 ───
  opa:
    image: openpolicyagent/opa:0.68.0
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
    volumes:
      - ./policies:/policies
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── 密钥管理 ───
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?VAULT_TOKEN is required - KMS root token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOCAL_CONFIG: |
        {
          "backend": {"file": {"path": "/vault/file"}},
          "ui": true
        }
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 应用�?───
  cds-api:
    image: cds-api:latest
    ports:
      - "8000:8000"
    environment:
      # Production must NOT run in DEBUG: it silently disables the
      # validate_security_config posture matrix (is_prod gate) and the JWT
      # secret requirement. Keep false unless actively debugging the stack.
      CDS_DEBUG: "false"
      CDS_LOG_JSON: "true"
      CDS_DATABASE_URL: postgresql+asyncpg://cds:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cds
      CDS_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CDS_CLICKHOUSE_URL: http://clickhouse:8123/cds_audit
      CDS_OPA_URL: http://opa:8181
      CDS_VAULT_ADDR: http://vault:8200
      CDS_VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required - KMS root token}
      CDS_MINIO_ENDPOINT: minio:9000
      CDS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      CDS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      CDS_JWT_SECRET_KEY: ${CDS_JWT_SECRET_KEY:?CDS_JWT_SECRET_KEY is required - JWT signing secret}
      # P0 hardening switches �?production fail-closed posture.
      CDS_SESSION_CLEANUP_INTERVAL_SECONDS: "300"
      CDS_KMS_REQUIRE_ATTESTATION: "true"
      # CB-01: service token for the Go volume plugin's KMS volume-key endpoints
      # (must match the plugin's CDS_VOLUME_PLUGIN_KMS_SERVICE_TOKEN; required).
      CDS_KMS_SERVICE_TOKEN: ${CDS_KMS_SERVICE_TOKEN:?CDS_KMS_SERVICE_TOKEN is required - Go volume plugin KMS token}
      CDS_DEV_SANDBOX_REQUIRE_CONTRACT: "true"
      # SS-19: 生产不在开发环里降级隔离等级 —— l2c 是唯一允许的开发环等级，
      # 生产 compose 也不携带 cds-jupyter 服务（未配 CDS_JUPYTER_PROXY_BASE_URL = 无入口）。
      CDS_DEV_SANDBOX_LEVEL: "l2c"
      # PZ-10 (spec ss-11): MFA (TOTP) + SM2 cert login. Prod requires an
      # explicit MFA encryption key (empty key refuses to boot).
      CDS_AUTH_MFA_ENABLED: "true"
      CDS_MFA_SECRET_ENCRYPTION_KEY: ${CDS_MFA_SECRET_ENCRYPTION_KEY:?CDS_MFA_SECRET_ENCRYPTION_KEY is required - MFA at-rest key}
      CDS_AUTH_CERT_LOGIN: "true"
      # W3: stricter login throttle; per-scope limits sized for one replica.
      CDS_SESSION_DEFAULT_IDLE_POLICY: "kill"
      CDS_EXEC_STREAM_MAX_CONCURRENT: "3"
      # N10 agent execution budgets
      CDS_AGENT_STEP_BUDGET: "15"
      CDS_AGENT_TOKEN_BUDGET: "20000"
      CDS_AGENT_MAX_TOOLS: "4"
      # W12 retention: audit/merkle keep-forever; alerts 180d. dry-run stays
      # true until a compliance review flips it explicitly.
      CDS_RETENTION_JANITOR_ENABLED: "true"
      CDS_AUDIT_LOG_RETENTION_DAYS: "0"
      CDS_MERKLE_LEAF_RETENTION_DAYS: "0"
      CDS_ALERT_RETENTION_DAYS: "180"
      CDS_RETENTION_JANITOR_DRY_RUN: "true"
      CDS_RETENTION_JANITOR_BATCH: "1000"
      # Round 45+ (spec N2): experimental Merkle batch pipeline, off by default
      CDS_MERKLE_PIPELINE_ENABLED: "false"
      CDS_EGRESS_AUDIT_ENABLED: "true"
      CDS_NODE_STALE_SECONDS: "300"
      # SS-10 CB-01: Cube (L2') node data plane — off by default. Enabling in prod
      # requires real node mTLS material (CDS_CUBE_NODE_TLS_CA) + CDS_CUBE_RESULTS_DIR.
      CDS_CUBE_DATAPLANE_ENABLED: "false"
      CDS_LEGACY_L2_ENABLED: "false"
      CDS_CUBE_NODE_GRPC_TLS: "true"
      CDS_CUBE_NODE_TLS_CA: ""
      CDS_CUBE_NODE_TLS_CERT: ""
      CDS_CUBE_NODE_TLS_KEY: ""
      CDS_CUBE_NODE_TLS_PROXY_PORT: "9443"
      CDS_CUBE_RESULTS_DIR: /var/lib/cds/sandbox-results
      CDS_CUBE_SANDBOX_IMAGE: cds/cube-sandbox:latest
      CDS_CUBE_DEK_LENGTH: "16"
      # CB-04: CubeEgress root CA artifact (CDS-side copy of node bring-up output)
      CDS_CUBE_EGRESS_CA: ""
      # CB-06: cube egress audit ingestion token (POST /internal/audit/egress);
      # empty = fail-closed (401). Must match the node tailer's credential.
      CDS_CUBE_AUDIT_SERVICE_TOKEN: ${CDS_CUBE_AUDIT_SERVICE_TOKEN:-}
      # CB-05: cube template artifact token signing (presigned URL TTL + HMAC token);
      # required in production when the cube data plane is enabled (fail-closed boot).
      CDS_CUBE_TEMPLATE_SIGNING_KEY: ${CDS_CUBE_TEMPLATE_SIGNING_KEY:-}
      CDS_CUBE_TEMPLATE_URL_TTL_SECONDS: "3600"
      CDS_CUBE_TEMPLATE_DIST_RETRY: "2"
      CDS_SHARED_VOLUME_ROOT: /data/shared-volumes
      CDS_EGRESS_AUDIT_ENCRYPTION_ENABLED: "true"
      CDS_EGRESS_AUDIT_LOG_PATH: /data/egress-audit/access.jsonl

      CDS_RATE_LIMIT_ENABLED: "true"
      CDS_RATE_LIMIT_PER_MINUTE_IP: "60"
      CDS_RATE_LIMIT_PER_MINUTE_USER: "600"
      CDS_RATE_LIMIT_AUTH_PER_MINUTE: "10"
      # Fail-closed simulation/fallback switches (validate_security_config
      # surfaces every enabled one at startup so degradation is never silent).
      # SECCOMP: never silently retry an exec without seccomp �?fail closed.
      CDS_SECCOMP_FALLBACK_ALLOWED: "false"
      # HSM: Vault is a required compose service, so an in-memory software KEK
      # fallback is unacceptable in production �?fail closed to real Vault.
      CDS_HSM_SOFTWARE_FALLBACK_ALLOWED: "false"
      # Hardware-gated switches. These stay TRUE until a real TEE/GPU backend is
      # provisioned (productization acceptance, FG-001/FG-002): the software-only
      # L0/L3 path and L1/L2 software-confidential fallback need them, and
      # ALLOW_SIMULATION=false would block KMS key distribution for software
      # levels (which produce no real quote). Flip to false ONLY once real
      # hardware attestation is available and verified.
      CDS_ALLOW_SIMULATION: "true"
      CDS_TEE_ALLOW_SOFTWARE_FALLBACK: "true"
      CDS_GPU_TEE_SIMULATION: "true"
      CDS_FEDERATION_JWT_KEY_REQUIRED: "true"
      # PZ-04/PZ-05 (specs/ss-11-cds-productization.md §7.1) — prod fail-closed
      # honesty gates: these RAISE at startup (validate_security_config) if left
      # at their dev defaults, so they are pinned here.
      CDS_MIA_SHADOW_MODEL: "false"
      CDS_SM3_FALLBACK_ALLOWED: "false"
      CDS_COLUMN_ENCRYPTION_KEY: ${CDS_COLUMN_ENCRYPTION_KEY:?CDS_COLUMN_ENCRYPTION_KEY is required - column DEK}
      CDS_ATTESTATION_ALLOWED_MEASUREMENTS: ${CDS_ATTESTATION_ALLOWED_MEASUREMENTS:?CDS_ATTESTATION_ALLOWED_MEASUREMENTS is required - csv TEE measurement whitelist}
      # PZ-05: federation is mTLS-terminated (FG-008). Until real cert/key/CA
      # material is provisioned the channel stays off — prod would RAISE
      # otherwise (fail-closed, not silent skip).
      CDS_FEDERATION_ENABLED: "false"
      CDS_FEDERATION_CA_BUNDLE: ""
      CDS_FEDERATION_CERT: ""
      CDS_FEDERATION_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio:
        condition: service_healthy
      opa:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      # 代码真值是 `/tmp/cds-sandbox*`（BwrapAdapter/ProcessAdapter 默认 root）；旧写法
      # 挂在 `/tmp/cds_sandbox`（下划线）上，从未覆盖真目录。两处写入都必须入卷：
      # 会话产物与降级后的对象存储原件，否则容器重建后库里 ready 指向空盘。
      - sandbox-workspace:/tmp/cds-sandbox
      - sandbox-workspace-l0:/tmp/cds-sandbox-l0
      - cds-storage:/tmp/cds-storage
      # A285: 环境里声明的运行时写入路径同样必须落卷。三条路径的目录都由代码自建
      # （egress_audit.py / shared_volumes.py 各自 mkdir -p），挂在目录而非文件上；
      # 未挂卷时它们只存在于容器可写层，`compose up --force-recreate` 后即消失：
      # /data/egress-audit（出口审计日志，retention 0=永久，丢了就是审计断链）、
      # /data/shared-volumes（共享卷根）、/var/lib/cds/sandbox-results（Cube 结果目录，
      # CDS_CUBE_DATAPLANE_ENABLED=true 时启用）。
      - cds-egress-audit:/data/egress-audit
      - cds-shared-volumes:/data/shared-volumes
      - cds-sandbox-results:/var/lib/cds/sandbox-results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  cds-frontend:
    image: cds-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      cds-api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  minio-data:
  vault-data:
  sandbox-workspace:
  sandbox-workspace-l0:
  cds-storage:
  # A285: 声明式写入路径对应的三个卷（见 cds-api.volumes 注释）。
  cds-egress-audit:
  cds-shared-volumes:
  cds-sandbox-results:
