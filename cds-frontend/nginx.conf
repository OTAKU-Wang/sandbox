server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 产物带 hash：可长期缓存，但不能被 SPA 兜底吞掉——缺文件要 404，不能回 HTML。
    location /assets/ {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 路由：HTML 必须 no-cache。一旦 index.html 被启发式缓存，重建后浏览器会拿旧 HTML
    # 去请求上一版的 hashed chunk，拿回的是兜底 HTML，严格 MIME 检查直接把整页打白
    # （2026-10-17 重建 cds-frontend 后在 Chrome 实现：/flow/tasks 白屏、root 0 节点）。
    # nginx 的 add_header 不向下累加（同级一旦自己声明就不再继承 server 级），所以安全头就地重定。
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Cache-Control "no-cache";
    }

    # 对外交付面（OpenAPI 结果端点 /open/v1/{slug}）
    location /open/ {
        proxy_pass http://cds-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 开发环反代（SS-19）：JupyterLab 要进 iframe，还要开 WebSocket 跑 kernel。
    # 公用的 /api/ 块把 Connection 置空（SSE 需要），会打断 WS 握手；
    # server 级的 X-Frame-Options: DENY 又会让 iframe 直接空白。两者在此就地改。
    location /api/jupyter/ {
        proxy_pass http://cds-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        # 同源 iframe：只让本站自己嵌，不是放开成任意源。本 location 自定义了
        # add_header，nginx 不再继承 server 级那套——这里逐条补齐，否则 nosniff /
        # X-XSS / Referrer / Cache 会在开发环前缀上集体消失。后端反代已按
        # /api/jupyter/ 前缀下发 SAMEORIGIN + 带 frame-ancestors 的完整 CSP，
        # hide 只为压掉 server 级重复的 DENY 副本，重加的是同一套值。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # API 代理
    location /api/ {
        proxy_pass http://cds-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
