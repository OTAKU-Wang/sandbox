services:
  # ─── 数据库层 ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cds
      POSTGRES_USER: cds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cds_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cds"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-cds_dev_redis} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cds_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: cds_audit
      CLICKHOUSE_USER: cds
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cds_dev_ch}

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cds_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cds_dev_minio_password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 策略引擎 ───
  opa:
    image: openpolicyagent/opa:0.68.0
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
    volumes:
      - ./policies:/policies
    healthcheck:
      # opa:0.68.0 是 distroless 镜像，里面没有 wget/shell——原来的 wget 健康检查永远过不了，
      # 于是 cds-api（depends_on opa: service_healthy）在任何机器上都起不来。
      # 与 docker-compose.prod.yml 保持同一写法（只用镜像里确实存在的 /opa 二进制）。
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── 密钥管理 ───
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-cds_vault_dev_token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      # 不能再叠 VAULT_LOCAL_CONFIG：dev 模式已用 DEV_LISTEN_ADDRESS 占了 8200，
      # 两份监听配置同时存在时 vault 报 `bind: address already in use` 直接退出，
      # 于是依赖 vault:service_healthy 的 cds-api 永远起不来。dev 存储为内存型，
      # 重启即清空，与 CDS_VAULT_TOKEN 的开发令牌口径一致；持久化 KV 请走
      # docker-compose.middleware.yml 里的 cds-vault-init 路径。
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 应用层 ───
  cds-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        # Dockerfile.api 已支持换源；CN 网络下直接 PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple 起构建。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    environment:
      CDS_DEBUG: "true"
      CDS_DATABASE_URL: postgresql+asyncpg://cds:${POSTGRES_PASSWORD:-cds_dev_password}@postgres:5432/cds
      CDS_REDIS_URL: redis://:${REDIS_PASSWORD:-cds_dev_redis}@redis:6379/0
      CDS_CLICKHOUSE_URL: http://clickhouse:8123/cds_audit
      CDS_OPA_URL: http://opa:8181
      CDS_VAULT_ADDR: http://vault:8200
      CDS_VAULT_TOKEN: ${VAULT_TOKEN:-cds_vault_dev_token}
      CDS_MINIO_ENDPOINT: minio:9000
      CDS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cds_minio_admin}
      CDS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cds_dev_minio_password}
      CDS_JWT_SECRET_KEY: ${CDS_JWT_SECRET_KEY:-dev_jwt_secret_change_in_prod_32bytes}
      # PZ-04/PZ-05 (specs/ss-11-cds-productization.md §7.1) — honesty & federation
      # gates, dev values (relaxed); prod template sets the fail-closed posture.
      CDS_MIA_SHADOW_MODEL: "false"
      CDS_COLUMN_ENCRYPTION_KEY: ""
      CDS_SM3_FALLBACK_ALLOWED: "true"
      CDS_FEDERATION_ENABLED: "true"
      CDS_FEDERATION_CA_BUNDLE: ""
      CDS_FEDERATION_CERT: ""
      CDS_FEDERATION_KEY: ""
      CDS_ATTESTATION_ALLOWED_MEASUREMENTS: ""
      # P0 hardening switches — dev values (relaxed); production template sets
      # the fail-closed posture. See .env.example for semantics.
      CDS_SESSION_CLEANUP_INTERVAL_SECONDS: "300"
      CDS_KMS_REQUIRE_ATTESTATION: "false"
      # CB-01: service token for the Go volume plugin's KMS volume-key endpoints.
      # Must match the plugin's CDS_VOLUME_PLUGIN_KMS_SERVICE_TOKEN. Empty =
      # volume-key endpoints fail-closed (401).
      CDS_KMS_SERVICE_TOKEN: ${CDS_KMS_SERVICE_TOKEN:-}
      CDS_DEV_SANDBOX_REQUIRE_CONTRACT: "false"
      # W3 rate limiting (dev: defaults are fine, keys shown for discoverability)
      CDS_SESSION_DEFAULT_IDLE_POLICY: "kill"
      CDS_EXEC_STREAM_MAX_CONCURRENT: "3"
      # PZ-10 (spec ss-11): MFA (TOTP) + SM2 cert login (dev: on, encryption
      # key empty = dev fallback; prod template requires an explicit key)
      CDS_AUTH_MFA_ENABLED: "true"
      CDS_MFA_SECRET_ENCRYPTION_KEY: ""
      CDS_AUTH_CERT_LOGIN: "true"
      # N10 agent execution budgets
      CDS_AGENT_STEP_BUDGET: "15"
      CDS_AGENT_TOKEN_BUDGET: "20000"
      CDS_AGENT_MAX_TOOLS: "4"
      # SS-10 CB-01: Cube (L2') node data plane — off by default (honest 400 while off).
      # dev allows plaintext node gRPC (grpc.dev); prod must use the TLS sidecar.
      CDS_CUBE_DATAPLANE_ENABLED: "false"
      CDS_LEGACY_L2_ENABLED: "false"
      CDS_CUBE_NODE_GRPC_TLS: "false"
      CDS_CUBE_NODE_TLS_PROXY_PORT: "9443"
      CDS_CUBE_RESULTS_DIR: /var/lib/cds/sandbox-results
      CDS_CUBE_SANDBOX_IMAGE: cds/cube-sandbox:latest
      CDS_CUBE_DEK_LENGTH: "16"
      # CB-04: CubeEgress root CA artifact (CDS-side copy of node bring-up output)
      CDS_CUBE_EGRESS_CA: ""
      # CB-06: cube egress audit ingestion token (POST /internal/audit/egress).
      # Empty = fail-closed (401) — the tailer must not be able to push without it.
      CDS_CUBE_AUDIT_SERVICE_TOKEN: ${CDS_CUBE_AUDIT_SERVICE_TOKEN:-}
      # CB-05: cube template artifact token signing (presigned URL TTL + HMAC token).
      CDS_CUBE_TEMPLATE_SIGNING_KEY: ${CDS_CUBE_TEMPLATE_SIGNING_KEY:-}
      CDS_CUBE_TEMPLATE_URL_TTL_SECONDS: "3600"
      CDS_CUBE_TEMPLATE_DIST_RETRY: "2"
      # W12 retention (dry-run default; flip after compliance review)
      CDS_RETENTION_JANITOR_ENABLED: "true"
      CDS_RETENTION_JANITOR_DRY_RUN: "true"
      # Round 45+ (spec N2): experimental Merkle batch pipeline, off by default
      CDS_MERKLE_PIPELINE_ENABLED: "false"
      # W13 egress audit (dev: plaintext JSONL under ./logs)
      CDS_EGRESS_AUDIT_ENABLED: "true"
      # W14 node stale detection
      CDS_NODE_STALE_SECONDS: "300"
      # W15/W19 volumes + audit encryption
      CDS_SHARED_VOLUME_ROOT: /data/shared-volumes
      CDS_EGRESS_AUDIT_ENCRYPTION_ENABLED: "true"

      CDS_RATE_LIMIT_ENABLED: "true"
      CDS_RATE_LIMIT_AUTH_PER_MINUTE: "10"
      # SS-19 开发环：笔记本经后端反代访问 cds-jupyter；本机无 Cube 节点，
      # 开 legacy 适配器仅供 dev（生产 validate_security_config 直接拒这个开关）。
      CDS_JUPYTER_PROXY_BASE_URL: http://cds-jupyter:8888
      CDS_JUPYTER_UPSTREAM_TOKEN: ${CDS_JUPYTER_UPSTREAM_TOKEN:-cds_dev_jupyter_token_change_me}
      CDS_SANDBOX_LEGACY_ENABLED: "true"
      # 本机没 Cube 节点，l2c 会 RUNTIME_UNAVAILABLE。开发环降到 L3=bwrap：
      # 它是合同 `allowed_sandbox_levels` 允许、且本机真实能跑的唯一等级
      # （L0=ProcessAdapter 不在线合同枚举里，L1/L2/k8s 需 k8s 集群），不是模拟。
      CDS_DEV_SANDBOX_LEVEL: "L3"
    # bwrap 需要建命名空间： Docker 默认 seccomp 下 `unshare(CLONE_NEWUSER)` 直接 EPERM
    # （本机实测），所以 dev 给这一份容器加宽免。NET_ADMIN 不是可选：bwrap 建新 netns 后
    # 要拉起 loopback（RTM_NEWADDR），实测缺它时报
    # `bwrap: loopback: Failed RTM_NEWADDR` 并 exit 1。仅 dev compose：
    # prod compose / helm 不带。代价是外层容器隔离变强能力交换，不得用于生产。
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio:
        condition: service_healthy
      opa:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      # 会话工作区真实根目录是 `/tmp/cds-sandbox*`（BwrapAdapter/ProcessAdapter 默认值，见
      # app/services/AGENTS.md）；旧写法挂在 `/tmp/cds_sandbox`（下划线）上，从未覆盖真目录，
      # 成果物随容器重建丢掉。这里按代码真值挂，并与 cds-jupyter 共享同一卷。
      - cds-workspaces:/tmp/cds-sandbox
      - cds-workspaces-l0:/tmp/cds-sandbox-l0
      # 对象存储本地后端的真根目录（storage_service._local_dir）。没有这个卷时，
      # 上传的供数原件只活在容器可写层：api 一重建字节就没了，而 data_resources
      # 行仍是 ready，开发环数据注入只能拿到空 input/（SS-19 e2e 实比）。
      - cds-storage:/tmp/cds-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  cds-frontend:
    build:
      context: ./cds-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      cds-api:
        condition: service_healthy

  # SS-19 开发环：JupyterLab 作为在线笔记本开发环境（容器隔离，非 MicroVM，前端标徒）。
  # 不映射宿主端口：只能经后端 /api/jupyter 反代访问，反代那一道验我们的 JWT + 一次性票据。
  cds-jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      JUPYTER_TOKEN: ${CDS_JUPYTER_UPSTREAM_TOKEN:-cds_dev_jupyter_token_change_me}
      JUPYTER_WORKSPACE_ROOT: /tmp/cds-sandbox
      JUPYTER_BASE_URL: /api/jupyter
    volumes:
      # 两卷与 cds-api 指同一卷但路径不同：L0 那一卷在开发环里只能从 root 下的 l0/
      # 看到，root_dir 以内就只有沙箱工作区（/tmp 里的 cds-uploads 与 data-load 明文供数
      # 对笔记本不可见）。jupyter_gateway._LEVEL_LAYOUT 与这里逐字对应。
      - cds-workspaces:/tmp/cds-sandbox
      - cds-workspaces-l0:/tmp/cds-sandbox/l0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:8888' + os.environ['JUPYTER_BASE_URL'] + '/api/status?token=' + os.environ['JUPYTER_TOKEN'])"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  minio-data:
  vault-data:
  # 开发环与 api 共享的会话工作区：Jupyter 写产物，api 负采集与 T5 审查。
  cds-workspaces:
  cds-workspaces-l0:
  # MinIO 客户端不可用时的降级落盘位（见 app/services/storage_service.py 告警）。
  cds-storage:
