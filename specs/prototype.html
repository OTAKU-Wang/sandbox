<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密态沙箱系统 (CDS) - 交互原型 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1419;--card:#1a1f2e;--card2:#232a3b;--card3:#2a3347;--border:#2d3748;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--primary:#3b82f6;--primary2:#2563eb;--green:#22c55e;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--purple:#a855f7;--cyan:#06b6d4}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.hdr .logo em{font-style:normal;background:linear-gradient(135deg,var(--primary),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .r{display:flex;align-items:center;gap:14px}
.role-btn{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text);transition:.15s}
.role-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.role-btn:hover:not(.active){border-color:var(--primary);color:var(--primary)}
.noti{position:relative;background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer}
.noti b{position:absolute;top:-3px;right:-5px;background:var(--red);color:#fff;font-size:9px;padding:1px 4px;border-radius:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.layout{display:flex;flex:1;overflow:hidden}
.sb{width:200px;background:var(--card);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;overflow-y:auto}
.sb .mg{padding:6px 20px 2px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
.sb .mi{padding:8px 20px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);transition:.12s;border-left:3px solid transparent}
.sb .mi:hover{background:var(--card2);color:var(--text)}
.sb .mi.on{background:rgba(59,130,246,.1);color:var(--primary);border-left-color:var(--primary)}
.sb .mi .ic{width:18px;text-align:center;font-size:14px}
.mn{flex:1;overflow-y:auto;padding:20px}
h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
h3{font-size:14px;margin-bottom:12px;color:var(--text2)}
.cg{display:grid;gap:14px;margin-bottom:18px}
.cg4{grid-template-columns:repeat(4,1fr)}
.cg3{grid-template-columns:repeat(3,1fr)}
.cg2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.cg4,.cg3{grid-template-columns:repeat(2,1fr)}}
.sc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.sc .lb{font-size:12px;color:var(--text2);margin-bottom:6px}
.sc .vl{font-size:24px;font-weight:700;line-height:1.2}
.sc .sb2{font-size:11px;color:var(--text2);margin-top:4px}
.sc.bl{border-left:3px solid var(--primary)}
.sc.bg{border-left:3px solid var(--green)}
.sc.by{border-left:3px solid var(--yellow)}
.sc.br{border-left:3px solid var(--red)}
.sc.bo{border-left:3px solid var(--orange)}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch h3{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;background:var(--card2);color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover td{background:rgba(59,130,246,.03)}
.bg{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.bg-g{background:rgba(34,197,94,.12);color:var(--green)}
.bg-y{background:rgba(234,179,8,.12);color:var(--yellow)}
.bg-o{background:rgba(249,115,22,.12);color:var(--orange)}
.bg-r{background:rgba(239,68,68,.12);color:var(--red)}
.bg-b{background:rgba(59,130,246,.12);color:var(--primary)}
.bg-p{background:rgba(168,85,247,.12);color:var(--purple)}
.bg-c{background:rgba(6,182,212,.12);color:var(--cyan)}
.bg-gr{background:rgba(148,163,184,.12);color:var(--text2)}
.btn{padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer;border:none;transition:.12s;display:inline-flex;align-items:center;gap:4px}
.bp{background:var(--primary);color:#fff}.bp:hover{background:var(--primary2)}
.bo2{background:transparent;border:1px solid var(--border);color:var(--text)}.bo2:hover{border-color:var(--primary);color:var(--primary)}
.bd{background:var(--red);color:#fff}
.bgn{background:var(--green);color:#fff}
.bw{background:var(--yellow);color:#000}
.bs{padding:3px 8px;font-size:11px}
.bg2{display:flex;gap:6px;flex-wrap:wrap}
.pr{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.pr .bar{height:100%;border-radius:3px;transition:width .4s}
.dt{font-family:'Fira Code',monospace;font-size:11px;background:var(--card2);padding:2px 6px;border-radius:3px;color:var(--cyan)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.dg{background:var(--green)}.dy{background:var(--yellow)}.dr{background:var(--red)}.dgr{background:var(--text3)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;transition:.12s}
.tab:hover{color:var(--text)}.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.bar-c{display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:8px}
.bar-c .b{flex:1;border-radius:3px 3px 0 0;min-width:16px;transition:height .4s;position:relative}
.bar-c .b:hover{opacity:.8}
.bar-c .b .bl2{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text3);white-space:nowrap}
.ev{max-height:240px;overflow-y:auto}
.ev-i{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.ev-i .tm{color:var(--text3);min-width:44px;font-size:11px}
.code{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'Fira Code',monospace;font-size:12px;line-height:1.5;color:#c9d1d9;white-space:pre;overflow-x:auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto}
.modal h2{font-size:16px}
.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.fi,.fs,.ft{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:5px;font-size:12px}
.fi:focus,.fs:focus,.ft:focus{outline:none;border-color:var(--primary)}
.ft{min-height:80px;font-family:monospace;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ckpt{display:flex;flex-wrap:wrap;gap:10px}
.ckpt label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.toast{position:fixed;top:64px;right:20px;background:var(--card);border:1px solid var(--green);border-radius:8px;padding:10px 16px;z-index:200;display:none;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.toast.show{display:flex;align-items:center;gap:6px;animation:si .3s}
@keyframes si{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.hidden{display:none!important}
.wizard-steps{display:flex;margin-bottom:18px}
.ws{flex:1;text-align:center;padding:8px;font-size:12px;color:var(--text3);position:relative}
.ws::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border)}
.ws.on{color:var(--primary)}.ws.on::before{background:var(--primary)}
.ws.done{color:var(--green)}.ws.done::before{background:var(--green)}
.search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:3px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid var(--border);color:var(--text2);transition:.12s}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.node-card{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:14px}
.node-card .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.node-card .nm{font-weight:600;font-size:13px}
.node-card .nm2{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}
.node-card .ml{color:var(--text3)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-i{position:relative;padding-bottom:12px;font-size:12px}
.tl-i::before{content:'';position:absolute;left:-16px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--card)}
.tl-i.done::before{background:var(--green)}
.tl-i.cur::before{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.flow-step{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card2);border-radius:6px;margin-bottom:6px;font-size:12px}
.flow-step .num{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.flow-step.done .num{background:var(--green)}
.flow-step.active .num{background:var(--yellow);color:#000}
.flow-arrow{text-align:center;color:var(--text3);font-size:14px;margin:2px 0}
.progress-wizard{display:flex;gap:4px;margin:12px 0}
.progress-wizard .step{flex:1;height:4px;border-radius:2px;background:var(--border)}
.progress-wizard .step.done{background:var(--green)}
.progress-wizard .step.active{background:var(--yellow)}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo"><span style="font-size:20px">🔒</span> <em>密态沙箱系统 CDS</em></div>
  <div class="r">
    <div style="display:flex;gap:4px" id="roleBtns">
      <button class="role-btn active" onclick="setRole('provider')">📦 数商</button>
      <button class="role-btn" onclick="setRole('buyer')">🛒 买方</button>
      <button class="role-btn" onclick="setRole('operator')">⚙️ 运营方</button>
      <button class="role-btn" onclick="setRole('regulator')">🔍 监管</button>
    </div>
    <button class="noti">🔔<b>3</b></button>
    <div class="av" id="avatarText">张</div>
  </div>
</div>

<div class="layout">
  <div class="sb" id="sidebar"></div>
  <div class="mn" id="main"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="mBg" onclick="if(event.target===this)cModal()">
  <div class="modal" id="mContent"></div>
</div>

<script>
let role='provider',page='dashboard';

const MENUS={
  provider:[
    {g:'工作台'},{k:'dashboard',i:'📊',t:'我的工作台'},
    {g:'产品开发'},{k:'devsandbox',i:'🧪',t:'开发沙箱'},{k:'products',i:'📦',t:'产品管理'},{k:'featplats',i:'🧩',t:'特征模板'},{k:'mymonitor',i:'📈',t:'使用监控'},
    {g:'系统'},{k:'mykeys',i:'🔑',t:'我的密钥'}
  ],
  buyer:[
    {g:'工作台'},{k:'dashboard',i:'📊',t:'我的工作台'},
    {g:'数据消费'},{k:'catalog',i:'🔍',t:'数据目录'},{k:'console',i:'💻',t:'沙箱控制台'},{k:'mytasks',i:'📋',t:'任务历史'},
    {g:'安全产出'},{k:'features',i:'🧬',t:'特征工程'},{k:'training',i:'🤖',t:'模型训练'},{k:'deploy',i:'🚀',t:'模型部署'},{k:'apisandbox',i:'🔌',t:'API沙箱'},
    {g:'系统'},{k:'mycerts',i:'🔑',t:'我的证书'}
  ],
  operator:[
    {g:'运维'},{k:'dashboard',i:'📊',t:'运营总览'},{k:'nodes',i:'🖥️',t:'节点管理'},{k:'cluster',i:'☁️',t:'沙箱集群'},
    {g:'治理'},{k:'contracts',i:'📋',t:'合约视览'},{k:'audit',i:'📝',t:'审计中心'},{k:'secureout',i:'🛡️',t:'安全产出审计'},{k:'connectors',i:'🔗',t:'连接器'},{k:'users',i:'👥',t:'用户管理'}
  ],
  regulator:[
    {g:'监管'},{k:'dashboard',i:'📊',t:'合规总览'},
    {g:'审计'},{k:'audit',i:'📝',t:'审计查询'},{k:'verify',i:'✅',t:'存证验真'},{k:'reports',i:'📄',t:'合规报告'}
  ]
};

const PAGES={
  provider:{dashboard:P_provDash,devsandbox:P_devSandbox,products:P_products,featplats:P_featPlats,mymonitor:P_myMonitor,mykeys:P_myKeys},
  buyer:{dashboard:P_buyerDash,catalog:P_catalog,console:P_console,mytasks:P_myTasks,features:P_features,training:P_training,deploy:P_deploy,apisandbox:P_apiSandbox,mycerts:P_myCerts},
  operator:{dashboard:P_opDash,nodes:P_nodes,cluster:P_cluster,contracts:P_contracts,audit:P_audit,secureout:P_secureOut,connectors:P_connectors,users:P_users},
  regulator:{dashboard:P_regDash,audit:P_regAudit,verify:P_verify,reports:P_reports}
};

function setRole(r){
  role=r;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.role-btn')[['provider','buyer','operator','regulator'].indexOf(r)].classList.add('active');
  document.getElementById('avatarText').textContent={provider:'张',buyer:'李',operator:'王',regulator:'陈'}[r];
  page='dashboard';renderNav();renderPage();
}

function renderNav(){
  const m=MENUS[role];
  let h='';
  m.forEach(x=>{
    if(x.g)h+=`<div class="mg">${x.g}</div>`;
    else h+=`<div class="mi${x.k===page?' on':''}" onclick="go('${x.k}')"><span class="ic">${x.i}</span>${x.t}</div>`;
  });
  document.getElementById('sidebar').innerHTML=h;
}

function go(p){page=p;renderNav();renderPage();}

function renderPage(){
  const fn=PAGES[role]?.[page];
  document.getElementById('main').innerHTML=fn?fn():'<p>页面不存在</p>';
}

function toast(m,tp='s'){const t=document.getElementById('toast');t.innerHTML=`${tp==='s'?'✅':'❌'} ${m}`;t.style.borderColor=tp==='s'?'var(--green)':'var(--red)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function sModal(h){document.getElementById('mContent').innerHTML=h;document.getElementById('mBg').classList.add('show');}
function cModal(){document.getElementById('mBg').classList.remove('show');}

// ==================== 数商视角 ====================
function P_provDash(){
  return `
    <h2>📊 数商工作台</h2>
    <div class="cg cg4">
      <div class="sc bg"><div class="lb">已发布产品</div><div class="vl">12</div><div class="sb2">本月 +3</div></div>
      <div class="sc bl"><div class="lb">草稿中</div><div class="vl">4</div><div class="sb2">待开发完成</div></div>
      <div class="sc by"><div class="lb">本月被消费</div><div class="vl">342</div><div class="sb2">买方任务数</div></div>
      <div class="sc bo"><div class="lb">DP预算消耗</div><div class="vl">67%</div><div class="sb2">全局平均</div></div>
    </div>
    <div class="cg cg2">
      <div class="card">
        <div class="ch"><h3>产品被消费排行</h3></div>
        <table>
          <tr><th>产品</th><th>任务数</th><th>买方数</th><th>DP消耗</th></tr>
          <tr><td>企业纳税数据2023</td><td>156</td><td>8</td><td>45.2ε</td></tr>
          <tr><td>医疗影像CT数据集</td><td>89</td><td>3</td><td>23.1ε</td></tr>
          <tr><td>金融风控特征数据</td><td>67</td><td>5</td><td>18.7ε</td></tr>
          <tr><td>客服语音录音数据</td><td>30</td><td>2</td><td>12.0ε</td></tr>
        </table>
      </div>
      <div class="card">
        <div class="ch"><h3>最近事件</h3></div>
        <div class="ev">
          <div class="ev-i"><span class="tm">10:30</span><span><span class="bg bg-b">消费</span> 买方"某金融科技"查询企业纳税数据, DP消耗0.5ε</span></div>
          <div class="ev-i"><span class="tm">10:15</span><span><span class="bg bg-g">发布</span> 产品"工业IoT日志"已发布至目录</span></div>
          <div class="ev-i"><span class="tm">09:45</span><span><span class="bg bg-y">告警</span> 合约C-003 DP预算即将耗尽(9.2/10ε)</span></div>
          <div class="ev-i"><span class="tm">09:20</span><span><span class="bg bg-p">开发</span> 沙箱质量检测完成:医疗影像数据完整率98%</span></div>
          <div class="ev-i"><span class="tm">09:00</span><span><span class="bg bg-c">密钥</span> DEK sandbox-dek-dp-001 已轮转</span></div>
        </div>
      </div>
    </div>`;
}

function P_devSandbox(){
  // Check if we're in wizard mode
  if(window._devWizard) return renderDevWizard();
  return renderDevSandboxHome();
}

function renderDevSandboxHome(){
  return `
    <h2>🧪 产品开发沙箱</h2>
    <p style="color:var(--text2);font-size:13px;margin-bottom:16px">在沙箱内完成数据产品的质量检测、脱敏预览、策略配置与发布。原始数据始终不出沙箱。</p>

    <div class="tabs" id="devTabs">
      <div class="tab on" onclick="showDevTab('struct')">📊 结构化数据</div>
      <div class="tab" onclick="showDevTab('semi')">📋 半结构化数据</div>
      <div class="tab" onclick="showDevTab('unstruct')">🖼️ 非结构化数据</div>
    </div>

    <div id="devStruct">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3>结构化数据产品</h3>
        <button class="btn bp" onclick="startWizard('struct')">+ 新建产品</button>
      </div>
      <div class="card"><table>
        <tr><th>产品</th><th>类型</th><th>数据源</th><th>规模</th><th>当前步骤</th><th>操作</th></tr>
        <tr><td>企业纳税数据2024</td><td><span class="bg bg-b">单表</span></td><td><span class="dt">tax_2024.csv</span> (2.3GB)</td><td>5,234,567行×28字段</td><td><span class="bg bg-y">步骤5: 脱敏预览</span></td>
          <td><button class="btn bp bs" onclick="resumeWizard('struct',4)">继续</button></td></tr>
        <tr><td>企业征信全景数据</td><td><span class="bg bg-p">多表(4表)</span></td><td><span class="dt">JDBC:mysql://10.0.1.5</span></td><td>4800万行×4表关联</td><td><span class="bg bg-y">步骤6: 策略配置</span></td>
          <td><button class="btn bp bs" onclick="sModal(multiTableConfig())">继续</button></td></tr>
        <tr><td>社保缴纳记录2024</td><td><span class="bg bg-b">单表</span></td><td><span class="dt">JDBC:mysql://10.0.1.5:3306/si_db</span></td><td>3,891,234行</td><td><span class="bg bg-g">步骤8: 测试</span></td>
          <td><button class="btn bp bs" onclick="resumeWizard('struct',7)">继续</button></td></tr>
      </table></div>
    </div>

    <div id="devSemi" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3>半结构化数据产品</h3>
        <button class="btn bp" onclick="startWizard('semi')">+ 新建产品</button>

window._devWizard = null;

function startWizard(dataType){
  window._devWizard = {dataType, step:0, data:{}};
  renderPage();
}

function resumeWizard(dataType, step){
  window._devWizard = {dataType, step, data:{
    name: dataType==='struct'?'企业纳税数据2024':'用户行为日志2024',
    category:'政务·财税', securityLevel:'L1'
  }};
  renderPage();
}

function wizardGo(step){
  window._devWizard.step = step;
  renderPage();
  document.querySelector('.mn').scrollTop = 0;
}

function wizardFinish(){
  window._devWizard = null;
  toast('产品已发布至数据目录 ✓');
  renderPage();
}

const WIZARD_STEPS = ['基本信息','数据接入','沙箱检测','敏感识别','脱敏预览','策略配置','测试验证','确认发布'];

function renderDevWizard(){
  const w = window._devWizard;
  const dt = w.dataType;
  const step = w.step;
  const dtLabel = {struct:'结构化', semi:'半结构化', unstruct:'非结构化'}[dt];
  const dtIcon = {struct:'📊', semi:'📋', unstruct:'🖼️'}[dt];

  let stepHtml = '';
  if(step===0) stepHtml = wizStep0(dt, dtLabel);
  else if(step===1) stepHtml = wizStep1(dt, dtLabel);
  else if(step===2) stepHtml = wizStep2(dt, dtLabel);
  else if(step===3) stepHtml = wizStep3(dt, dtLabel);
  else if(step===4) stepHtml = wizStep4(dt, dtLabel);
  else if(step===5) stepHtml = wizStep5(dt, dtLabel);
  else if(step===6) stepHtml = wizStep6(dt, dtLabel);
  else if(step===7) stepHtml = wizStep7(dt, dtLabel);

  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn bo2" onclick="window._devWizard=null;renderPage()">← 返回</button>
      <h2 style="margin:0">${dtIcon} 新建${dtLabel}数据产品</h2>
    </div>
    <div class="wizard-steps">
      ${WIZARD_STEPS.map((s,i)=>`<div class="ws${i<step?' done':i===step?' on':''}" onclick="${i<=step?`wizardGo(${i})`:''}" style="cursor:${i<=step?'pointer':'default'}">${i+1}. ${s}</div>`).join('')}
    </div>
    ${stepHtml}
    <div style="display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      ${step>0?`<button class="btn bo2" onclick="wizardGo(${step-1})">← 上一步</button>`:'<div></div>'}
      ${step<7?`<button class="btn bp" onclick="wizardGo(${step+1})">${step===1?'上传并检测':'下一步 →'}</button>`:`<button class="btn bgn" onclick="wizardFinish()">✓ SM2签名并发布</button>`}
    </div>`;
}

    </table></div>
    <div class="card" style="margin-top:14px">
      <h4 style="font-size:13px;margin-bottom:8px">模板定义示例: tax_stability</h4>
      <div class="code" style="font-size:11px">-- 安全特征模板: 纳税稳定性
-- 输出: 每个企业的纳税变异系数 (越低越稳定)
-- 安全保障: 聚合统计, 不含单条纳税记录

SELECT ent_id,
       STDDEV(tax_amount) / NULLIF(AVG(tax_amount), 0) AS tax_cv,
       COUNT(*) AS tax_years,
       MIN(year) AS first_year,
       MAX(year) AS last_year
FROM tax_records
WHERE year >= EXTRACT(YEAR FROM CURRENT_DATE) - {lookback_years}
  AND ent_id IN (
    SELECT ent_id FROM enterprise_basic
    WHERE industry_code = '{industry_code}'
  )
GROUP BY ent_id
HAVING COUNT(*) >= {min_years}

-- 参数:
--   lookback_years: 回溯年数 (默认3)
--   industry_code: 行业过滤 (可选)
--   min_years: 最少年份数 (默认2)

-- 安全保证:
--   ✅ 输出为聚合值 (均值/标准差), 不含原始纳税额
--   ✅ HAVING过滤确保样本充分 (≥2年)
--   ✅ 仅输出 ent_id + 统计值, 无其他敏感字段</div>
    </div>`;
}
