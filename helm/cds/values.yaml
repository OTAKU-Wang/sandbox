# CDS Helm Chart �?Default Values
replicaCount: 2

image:
  api:
    repository: cds/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: cds/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent

# ─── API Service ───
api:
  port: 8000
  workers: 4
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  env:
    CDS_DEBUG: "false"
    LOG_LEVEL: info
    # P0 hardening switches �?production fail-closed posture.
    # NOTE: KMS_REQUIRE_ATTESTATION=true rejects key distribution for
    # software-only sandbox levels (L0/L3); deployments that rely on them must
    # explicitly set this to "false" (see docs/ai-sandbox-gap-remediation-plan.md).
  CDS_LOG_JSON: "false"  # set "true" for structured JSON logs (W1)
  # CDS_METRICS_API_TOKEN: ""  # set a bearer token to protect /metrics
    CDS_SESSION_CLEANUP_INTERVAL_SECONDS: "300"
    CDS_KMS_REQUIRE_ATTESTATION: "true"
    CDS_DEV_SANDBOX_REQUIRE_CONTRACT: "true"

# ─── Frontend Service ───
frontend:
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── PostgreSQL ───
postgresql:
  enabled: true
  auth:
    database: cds
    username: cds
    existingSecret: cds-db-credentials
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

# ─── Redis ───
redis:
  enabled: true
  auth:
    existingSecret: cds-redis-credentials
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

# ─── ClickHouse (audit) ───
clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.3-alpine"
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

# ─── OPA (policy engine) ───
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: "0.68.0"
  port: 8181
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# ─── Ingress ───
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: cds.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: cds-tls
      hosts:
        - cds.example.com

# ─── Secrets (reference K8s secrets) ───
secrets:
  existingSecret: cds-secrets
  # Keys expected in the secret:
  # CDS_DATABASE_URL, CDS_REDIS_URL, CDS_CLICKHOUSE_URL, CDS_JWT_SECRET_KEY,
  # CDS_VAULT_ADDR, CDS_VAULT_TOKEN, CDS_MINIO_ENDPOINT,
  # CDS_MINIO_ACCESS_KEY, CDS_MINIO_SECRET_KEY
  # Optional: CDS_CDC_KAFKA_BROKERS

# ─── Sandbox workspace ───
sandbox:
  workspaceSize: 20Gi
  storageClass: ""
