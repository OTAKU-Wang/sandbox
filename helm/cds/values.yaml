# CDS Helm Chart �?Default Values
replicaCount: 2

# W17: availability hardening
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: 1

image:
  api:
    repository: cds/api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: cds/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent

# ─── API Service ───
api:
  port: 8000
  workers: 4
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  env:
    CDS_DEBUG: "false"
    LOG_LEVEL: info
    CDS_LOG_JSON: "false"
    CDS_SESSION_CLEANUP_INTERVAL_SECONDS: "300"
    CDS_KMS_REQUIRE_ATTESTATION: "true"
    # CB-01: service token for the Go volume plugin's KMS volume-key endpoints.
    # Must match the plugin's CDS_VOLUME_PLUGIN_KMS_SERVICE_TOKEN. Ship empty and
    # supply via the cds-secrets secret; empty = volume-key endpoints fail-closed.
    CDS_KMS_SERVICE_TOKEN: ""
    CDS_DEV_SANDBOX_REQUIRE_CONTRACT: "true"
    # SS-19: 开发环等级。chart 默认 l2c（MicroVM）且不开 cds-jupyter；
    # 要开开发环需额外部一份 Jupyter 服务并填 CDS_JUPYTER_PROXY_BASE_URL。
    CDS_DEV_SANDBOX_LEVEL: "l2c"
    # PZ-10 (spec ss-11): MFA (TOTP) + SM2 cert login. The chart ships the
    # fail-closed posture: deployers MUST supply a real MFA encryption key
    # (empty key refuses to boot in prod via validate_security_config).
    CDS_AUTH_MFA_ENABLED: "true"
    CDS_MFA_SECRET_ENCRYPTION_KEY: ""
    CDS_AUTH_CERT_LOGIN: "true"
    # W3 rate limiting (Redis fixed window, fail-open on Redis outage)
    CDS_SESSION_DEFAULT_IDLE_POLICY: "kill"
    CDS_EXEC_STREAM_MAX_CONCURRENT: "3"
    # N10 agent execution budgets
    CDS_AGENT_STEP_BUDGET: "15"
    CDS_AGENT_TOKEN_BUDGET: "20000"
    CDS_AGENT_MAX_TOOLS: "4"
    # W12 retention janitor (see docs/retention.md)
    CDS_RETENTION_JANITOR_ENABLED: "true"
    CDS_AUDIT_LOG_RETENTION_DAYS: "0"
    CDS_MERKLE_LEAF_RETENTION_DAYS: "0"
    CDS_ALERT_RETENTION_DAYS: "180"
    CDS_RETENTION_JANITOR_DRY_RUN: "true"
    CDS_RETENTION_JANITOR_BATCH: "1000"
    # Round 45+ (spec N2): experimental Merkle batch pipeline, off by default
    CDS_MERKLE_PIPELINE_ENABLED: "false"
    CDS_EGRESS_AUDIT_ENABLED: "true"
    CDS_NODE_STALE_SECONDS: "300"
    CDS_SHARED_VOLUME_ROOT: /data/shared-volumes
    CDS_EGRESS_AUDIT_LOG_PATH: /data/egress-audit/access.jsonl
    CDS_EGRESS_AUDIT_ENCRYPTION_ENABLED: "true"

    CDS_RATE_LIMIT_ENABLED: "true"
    CDS_RATE_LIMIT_PER_MINUTE_IP: "60"
    CDS_RATE_LIMIT_PER_MINUTE_USER: "600"
    CDS_RATE_LIMIT_AUTH_PER_MINUTE: "10"
    # PZ-04/PZ-05 (specs/ss-11-cds-productization.md §7.1) — prod honesty &
    # federation gates. The chart ships the fail-closed posture; deployers must
    # supply real values (empty key/measurements RAISE at startup via
    # validate_security_config) or disable the feature they cannot back.
    CDS_MIA_SHADOW_MODEL: "false"
    CDS_SM3_FALLBACK_ALLOWED: "false"
    CDS_COLUMN_ENCRYPTION_KEY: ""  # 16-byte column DEK (hex or base64) — required in prod
    CDS_ATTESTATION_ALLOWED_MEASUREMENTS: ""  # csv SM3 whitelist — required with KMS_REQUIRE_ATTESTATION=true
    CDS_FEDERATION_ENABLED: "false"  # flip true only with real mTLS material below (FG-008)
    CDS_FEDERATION_CA_BUNDLE: ""
    CDS_FEDERATION_CERT: ""
    CDS_FEDERATION_KEY: ""
    # SS-10 CB-01: Cube (L2') node data plane — off by default. Enabling in prod
    # requires real node mTLS material (CDS_CUBE_NODE_TLS_CA) + a results dir.
    CDS_CUBE_DATAPLANE_ENABLED: "false"
    CDS_LEGACY_L2_ENABLED: "false"
    CDS_CUBE_NODE_GRPC_TLS: "true"
    CDS_CUBE_NODE_TLS_CA: ""
    CDS_CUBE_NODE_TLS_CERT: ""
    CDS_CUBE_NODE_TLS_KEY: ""
    CDS_CUBE_NODE_TLS_PROXY_PORT: "9443"
    CDS_CUBE_NODE_GRPC_DEADLINE_MS: "5000"
    CDS_CUBE_NODE_HEARTBEAT_SECONDS: "30"
    CDS_CUBE_RESULTS_DIR: /var/lib/cds/sandbox-results
    CDS_CUBE_SANDBOX_IMAGE: cds/cube-sandbox:latest
    CDS_CUBE_DEK_LENGTH: "16"
    # CB-04: CubeEgress root CA artifact (CDS-side copy of node bring-up output
    # /etc/cube/ca/cube-root-ca.crt); consumed by the CB-05 template probe.
    CDS_CUBE_EGRESS_CA: ""
    # CB-06: cube egress audit ingestion token (POST /internal/audit/egress);
    # empty = fail-closed (401).
    CDS_CUBE_AUDIT_SERVICE_TOKEN: ""
    # CB-05: cube template artifact token signing (presigned URL TTL + HMAC token);
    # required in production when the cube data plane is enabled (fail-closed boot).
    CDS_CUBE_TEMPLATE_SIGNING_KEY: ""
    CDS_CUBE_TEMPLATE_URL_TTL_SECONDS: "3600"
    CDS_CUBE_TEMPLATE_DIST_RETRY: "2"

# ─── Frontend Service ───
frontend:
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── PostgreSQL ───
postgresql:
  enabled: true
  auth:
    database: cds
    username: cds
    existingSecret: cds-db-credentials
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

# ─── Redis ───
redis:
  enabled: true
  auth:
    existingSecret: cds-redis-credentials
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

# ─── ClickHouse (audit) — EXTERNALLY MANAGED ───
# This chart ships NO ClickHouse template. `enabled: true` here only marks that
# the CDS audit path expects a ClickHouse; the actual service must be provided
# out-of-band and referenced via `api.env.CDS_CLICKHOUSE_URL` (typically
# injected through `secrets.existingSecret`). Flip to false when audit is not
# deployed.
clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.3-alpine"
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

# ─── OPA (policy engine) — EXTERNALLY MANAGED ───
# This chart ships NO OPA Deployment (the historical `-opa` Service was removed
# as a dangling selector — nothing in this chart matched it). Point the API at
# an out-of-band OPA instance via `api.env.CDS_OPA_URL` (through
# `secrets.existingSecret`); the compose/k8s-manifest paths still bundle OPA.
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: "0.68.0"
  port: 8181
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# ─── External component whitelist ───
# Components whose `enabled: true` does NOT map to an in-chart template or a
# Chart.yaml dependency. They are provisioned externally and wired via
# api.env / secrets.existingSecret. tests/test_helm_chart.py asserts every
# `*.enabled=true` component is either templated, a declared dependency, or
# listed here — add a new external component to this list, never silently.
externalComponents:
  - clickhouse
  - opa

# ─── Ingress ───
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: cds.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: cds-tls
      hosts:
        - cds.example.com

# ─── Secrets (reference K8s secrets) ───
secrets:
  existingSecret: cds-secrets
  # Keys expected in the secret:
  # CDS_DATABASE_URL, CDS_REDIS_URL, CDS_CLICKHOUSE_URL, CDS_JWT_SECRET_KEY,
  # CDS_VAULT_ADDR, CDS_VAULT_TOKEN, CDS_MINIO_ENDPOINT,
  # CDS_MINIO_ACCESS_KEY, CDS_MINIO_SECRET_KEY
  # Optional: CDS_CDC_KAFKA_BROKERS

# ─── Sandbox workspace ───
sandbox:
  workspaceSize: 20Gi
  storageClass: ""
