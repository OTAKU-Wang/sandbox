apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cds.fullname" . }}-api
  labels:
    {{- include "cds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cds.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cds.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: REDIS_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CLICKHOUSE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: JWT_SECRET
            - name: KMS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: KMS_MASTER_KEY
            - name: OPA_URL
              value: "http://{{ include "cds.fullname" . }}-opa:{{ .Values.opa.port }}"
            - name: ENVIRONMENT
              value: {{ .Values.api.env.ENVIRONMENT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.api.env.LOG_LEVEL | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: sandbox-workspace
              mountPath: /tmp/cds_sandbox
      volumes:
        - name: sandbox-workspace
          persistentVolumeClaim:
            claimName: {{ include "cds.fullname" . }}-sandbox
