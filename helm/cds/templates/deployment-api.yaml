apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cds.fullname" . }}-api
  labels:
    {{- include "cds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cds.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cds.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: CDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_DATABASE_URL
            - name: CDS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_REDIS_URL
            - name: CDS_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_CLICKHOUSE_URL
            - name: CDS_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_JWT_SECRET_KEY
            - name: CDS_VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_VAULT_ADDR
            - name: CDS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_VAULT_TOKEN
            - name: CDS_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_ENDPOINT
            - name: CDS_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_ACCESS_KEY
            - name: CDS_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_SECRET_KEY
            - name: CDS_CDC_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_CDC_KAFKA_BROKERS
                  optional: true
            - name: CDS_OPA_URL
              value: "http://{{ include "cds.fullname" . }}-opa:{{ .Values.opa.port }}"
            - name: CDS_DEBUG
              value: {{ .Values.api.env.CDS_DEBUG | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.api.env.LOG_LEVEL | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: sandbox-workspace
              mountPath: /tmp/cds_sandbox
      volumes:
        - name: sandbox-workspace
          persistentVolumeClaim:
            claimName: {{ include "cds.fullname" . }}-sandbox
