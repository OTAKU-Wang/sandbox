apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cds.fullname" . }}-api
  labels:
    {{- include "cds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # The HPA owns the replica count when autoscaling is on; rendering
  # `replicas:` there makes every `helm upgrade` fight the autoscaler (and
  # scale pod number back down mid-incident). Only pin it when autoscaling is
  # disabled.
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "cds.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Env lives in the ConfigMap and the Secret; without a checksum neither
        # change rolls the pods, so a re-deploy silently keeps running the old
        # values. The Secret is provisioned out-of-band (existingSecret), so its
        # content cannot be hashed here — bump .Values.secrets.checksum after a
        # rotation to get the same effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ .Values.secrets.checksum | default .Values.secrets.existingSecret | sha256sum }}
      labels:
        {{- include "cds.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: CDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_DATABASE_URL
            - name: CDS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_REDIS_URL
            - name: CDS_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_CLICKHOUSE_URL
            - name: CDS_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_JWT_SECRET_KEY
            # P6（2026-10-30）：boot 门位强制密钥走 Secret，不再只能"记在注释里"。
            # 这两把键在 prod 姿态被 validate_security_config 硬性要求非空
            # （列级 DEK / MFA TOTP 种子主密钥），空值 = 拒绝启动，dev 默认密钥
            # 永远不应出现在生产 Pod 上，所以它们和 JWT 一样必须来自
            # existingSecret；optional: true 让缺键先落在 boot 的拒启错误上，
            # 而不是 Pod 起不来的 CreateContainerConfigError。
            - name: CDS_COLUMN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_COLUMN_ENCRYPTION_KEY
                  optional: true
            - name: CDS_MFA_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MFA_SECRET_ENCRYPTION_KEY
                  optional: true
            - name: CDS_VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_VAULT_ADDR
            - name: CDS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_VAULT_TOKEN
            - name: CDS_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_ENDPOINT
            - name: CDS_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_ACCESS_KEY
            - name: CDS_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_SECRET_KEY
            - name: CDS_CDC_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_CDC_KAFKA_BROKERS
                  optional: true
            - name: CDS_OPA_URL
              # A302: was hardcoded to `<fullname>-opa`, a Service this chart
              # does not ship — every policy call failed with NXDOMAIN. The
              # address is a values key the deployer points at their OPA.
              value: {{ .Values.opa.url | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "cds.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sandbox-workspace
              mountPath: /tmp/cds-sandbox
              subPath: sandbox
              # 真值路径是 /tmp/cds-sandbox（连字符）；旧写法 /tmp/cds_sandbox 从未覆盖真目录。
            - name: sandbox-workspace
              # L0 会话工作区（sandbox_runtime.py 默认 root）：未挂卷时只存在于容器可写层。
              mountPath: /tmp/cds-sandbox-l0
              subPath: sandbox-l0
            - name: sandbox-workspace
              # storage_service.py 的对象存储回退目录：库里 ready 的对象原件。
              mountPath: /tmp/cds-storage
              subPath: storage
            - name: sandbox-workspace
              # A285: 出口审计日志目录（retention 0=永久，丢盘即审计断链）。
              mountPath: /data/egress-audit
              subPath: egress-audit
            - name: sandbox-workspace
              # A285: 共享卷根（CDS_SHARED_VOLUME_ROOT）。
              mountPath: /data/shared-volumes
              subPath: shared-volumes
            - name: sandbox-workspace
              # CDS_CUBE_RESULTS_DIR：Cube(L2') 数据面开启时的结果回收目录。
              mountPath: /var/lib/cds/sandbox-results
              subPath: cube-results
            {{- if .Values.kms.masterKeyFile }}
            # P2-3：KMS 主密钥目录（sandbox-workspace RWX 的 subPath，全副本同键）。
            - name: sandbox-workspace
              mountPath: /var/lib/cds-kms
              subPath: kms-master
            {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cds.api.selectorLabels" . | nindent 14 }}
      volumes:
        # One RWX share (see sandbox.accessModes) carved into subPaths, so every
        # declared runtime write path survives a pod recreate and every replica
        # sees the same workspace. An RWO class here would Multi-Attach-stall the
        # second replica the HPA creates.
        - name: sandbox-workspace
          persistentVolumeClaim:
            claimName: {{ include "cds.fullname" . }}-sandbox
