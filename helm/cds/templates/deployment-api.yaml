apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cds.fullname" . }}-api
  labels:
    {{- include "cds.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cds.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cds.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: CDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_DATABASE_URL
            - name: CDS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_REDIS_URL
            - name: CDS_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_CLICKHOUSE_URL
            - name: CDS_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_JWT_SECRET_KEY
            - name: CDS_VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_VAULT_ADDR
            - name: CDS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_VAULT_TOKEN
            - name: CDS_MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_ENDPOINT
            - name: CDS_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_ACCESS_KEY
            - name: CDS_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_MINIO_SECRET_KEY
            - name: CDS_CDC_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CDS_CDC_KAFKA_BROKERS
                  optional: true
            - name: CDS_OPA_URL
              value: "http://{{ include "cds.fullname" . }}-opa:{{ .Values.opa.port }}"
          envFrom:
            - configMapRef:
                name: {{ include "cds.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sandbox-workspace
              # 真值路径是 /tmp/cds-sandbox（连字符）；旧写法 /tmp/cds_sandbox 从未覆盖真目录。
              # L0 卷（/tmp/cds-sandbox-l0）与对象存储卷（/tmp/cds-storage）尚未由本 chart 供给 PVC：
              # 未挂前 L0/存储写入只在容器层，重建即丢——多租户生产前必须补 PVC（对齐 compose prod 三卷）。
              mountPath: /tmp/cds-sandbox
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cds.api.selectorLabels" . | nindent 14 }}
      volumes:
        - name: sandbox-workspace
          persistentVolumeClaim:
            claimName: {{ include "cds.fullname" . }}-sandbox
