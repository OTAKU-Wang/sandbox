{{- if .Values.podDisruptionBudget }}
# Guarded on the values block existing: an overlay that deletes
# `podDisruptionBudget:` must skip this object, not nil-pointer the whole
# release render.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cds.fullname" . }}-api
  labels:
    {{- include "cds.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cds.api.selectorLabels" . | nindent 6 }}
{{- end }}
