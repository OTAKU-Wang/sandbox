# CDS Middleware — Production-grade local deployment
# Usage: docker compose -f docker-compose.middleware.yml up -d
version: "3.9"

services:
  # ── PostgreSQL (primary database) ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cds-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cds
      POSTGRES_USER: cds_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CdsSecureP@ss2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cds_admin -d cds"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=200
        -c log_statement=mod
        -c log_min_duration_statement=500

  # ── Redis (caching + quota counters + session store) ───────
  redis:
    image: redis:7-alpine
    container_name: cds-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly yes
        --requirepass ${REDIS_PASSWORD:-CdsRedis2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CdsRedis2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: cds-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cds_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CdsMinio2026!}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vault (HSM / Transit encryption) ──────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: cds-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://vault:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vaultdata:/vault/data
      - ./scripts/vault-init.sh:/vault/config/init.sh:ro
    command: server
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Vault Init (one-shot setup) ───────────────────────────
  vault-init:
    image: hashicorp/vault:1.17
    container_name: cds-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
    volumes:
      - ./scripts/vault-init.sh:/vault/config/init.sh:ro
    entrypoint: /bin/sh
    command: /vault/config/init.sh
    restart: "no"

  # ── ClickHouse (audit log OLAP) ───────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: cds-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9009:9009"  # native protocol (9000 conflicts with MinIO)
    environment:
      CLICKHOUSE_DB: cds_audit
      CLICKHOUSE_USER: cds_ch
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-CdsCH2026}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka + Debezium (CDC pipeline) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cds-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zkdata:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cds-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Debezium (CDC connector for PostgreSQL) ───────────────
  debezium:
    image: debezium/connect:2.6
    container_name: cds-debezium
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cds-cdc
      CONFIG_STORAGE_TOPIC: cds_connect_configs
      OFFSET_STORAGE_TOPIC: cds_connect_offsets
      STATUS_STORAGE_TOPIC: cds_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  vaultdata:
  chdata:
  zkdata:
  kafkadata:
