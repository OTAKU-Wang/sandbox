; tls-proxy.stunnel.conf — CDS 组件②（SS-10 CB-02，§2.10）
; 由 install.sh 渲染 __TLS_PROXY_PORT__ / __CUBELET_GRPC_PORT__ 后落盘到
; /etc/cds/tls-proxy/stunnel.conf（模板本身不入节点）。
;
; 语义：mTLS 终结点——verify=2 强制并校验客户端证书（CDS 控制面持
; certificate_service 签发的客户端证书；CA 在 ca.crt）。后端为本地
; 明文 cubelet gRPC（stock cubelet 为 plaintext-only，§2.10 源码核实）。
; 红线：本 unit 不存在/不运行 = 节点不可接入（CDS 不做明文回退）。

foreground = yes
options = TLSv1.2
sslVersion = TLSv1.2
socket = a:SO_REUSEADDR=1
log = /var/log/cds/tls-proxy.log
pid = /run/cds-tls-proxy.pid
; 证书三件套由 install.sh 从 CDS_CUBE_TLS_CERT/KEY/CA 安装（certificate_service 签发）
cert = /etc/cds/tls-proxy/tls.crt
key = /etc/cds/tls-proxy/tls.key
CAfile = /etc/cds/tls-proxy/ca.crt
; verify = 2：要求对端出示证书并校验链（mTLS）。
; 0/1 = 无/可选客户端证书 —— 生产禁用（M-08 纪律：生产默认不裸跑）
verify = 2

; ---- 客户端段：连接本地明文 cubelet gRPC ----
[client]
accept = 0.0.0.0:__TLS_PROXY_PORT__
connect = 127.0.0.1:__CUBELET_GRPC_PORT__
TIMEOUTCONNECT = 5
TIMEOUTIDLE = 3600
