[project]
name = "cds-sdk"
version = "0.3.0"
description = "Python SDK for the CDS confidential data sandbox (sessions, files, snapshots, exec, logs)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
# PZ-11②: WS streaming exec (ws-ticket flow). Optional — the core SDK works
# without it and raises a clear CDSError when streaming is attempted.
stream = ["websocket-client>=1.6"]
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cds_sdk*"]
