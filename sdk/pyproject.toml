[project]
name = "cds-sdk"
version = "0.1.0"
description = "Python SDK for the CDS confidential data sandbox (sessions, files, snapshots, exec, logs)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cds_sdk*"]
