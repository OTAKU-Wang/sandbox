[project]
name = "cds-sdk"
version = "0.3.0"
description = "Python SDK for the CDS confidential data sandbox (sessions, files, snapshots, exec, logs)"
requires-python = ">=3.10"
# A207: bounded ranges. httpx is pre-1.0 — 0.x minors may still break
# behaviour this client leans on, so cap at <1.0; the stream extra follows
# the same discipline. Version stays single-sourced from [project].version
# (A78) — do not mirror it anywhere else.
dependencies = ["httpx>=0.27.0,<1.0"]
readme = "README.md"

[project.optional-dependencies]
# PZ-11②: WS streaming exec (ws-ticket flow). Optional — the core SDK works
# without it and raises a clear CDSError when streaming is attempted.
stream = ["websocket-client>=1.6,<2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cds_sdk*"]

# A207: ship the typing marker so mypy/pyright consumers see the SDK's
# annotations (both modules are annotated throughout).
[tool.setuptools.package-data]
cds_sdk = ["py.typed"]
