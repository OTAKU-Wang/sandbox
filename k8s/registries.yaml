mirrors:
  # k3s normalizes the Docker Hub host to `docker.io`; a second `index.docker.io`
  # block was dead config (never consulted) that made it look like the mirror was
  # configured twice.
  "docker.io":
    endpoint:
      - "https://docker.1ms.run"
      - "https://docker.m.daocloud.io"
  "registry.k8s.io":
    endpoint:
      - "https://registry.k8s.io.m.daocloud.io"
  "quay.io":
    endpoint:
      - "https://quay.m.daocloud.io"
  "ghcr.io":
    endpoint:
      - "https://ghcr.m.daocloud.io"
