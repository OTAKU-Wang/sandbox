apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: cds-system
  labels:
    app: minio
spec:
  replicas: 1
  # PVC 单例（local-path/RWO）：RollingUpdate 的 surge pod 永远卡在 ContainerCreating。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-01-20T14-49-07Z
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: miniodata
              mountPath: /data
          # minio/minio 镜像里没有 mc 二进制（mc 在 minio/mc 镜像），旧探针从未成功过。
          # /minio/health/live 是这个镜像自带的免凭据存活/就绪端点（API 端口 9000）。
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: miniodata
          persistentVolumeClaim:
            claimName: miniodata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cds-system
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miniodata-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
