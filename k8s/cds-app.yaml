apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-api
  namespace: cds-system
  labels:
    app: cds-api
spec:
  # A302: 单副本。下面的工作区卷在本路径上是 local-path / RWO，2 副本时每个 pod
  # 写自己那份可写层，读请求打到另一个 pod 就是空盘；要横向扩展必须先把
  # workspace 换成 ReadWriteMany（helm 路径已如此）。
  replicas: 1
  # PVC 单例不能用默认 RollingUpdate：surge pod 因 Multi-Attach / node affinity
  # 永远停在 ContainerCreating，升级直接卡死。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cds-api
  template:
    metadata:
      labels:
        app: cds-api
    spec:
      containers:
        - name: cds-api
          image: cds-api:latest
          imagePullPolicy: Never  # Use local k3s image
          ports:
            - containerPort: 8000
          env:
            - name: CDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_DATABASE_URL
            - name: CDS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_REDIS_URL
            - name: CDS_VAULT_ADDR
              value: "http://vault:8200"
            - name: CDS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_VAULT_TOKEN
            - name: CDS_MINIO_ENDPOINT
              value: "minio:9000"
            - name: CDS_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_MINIO_ACCESS_KEY
            - name: CDS_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_MINIO_SECRET_KEY
            - name: CDS_CDC_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_CDC_KAFKA_BROKERS
            - name: CDS_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_CLICKHOUSE_URL
            - name: CDS_OPA_URL
              value: "http://opa:8181"
            - name: CDS_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_JWT_SECRET_KEY
            # P6（2026-10-30）：boot 门位强制密钥正式接线（此前只"记在注释里"）。
            # 列级 DEK 与 MFA TOTP 种子主密钥在 prod 姿态被 validate_security_config
            # 硬性要求非空（空值拒绝启动）；密钥不进 ConfigMap，只走 cds-secrets。
            # optional: true 让缺键落在 boot 的可读拒启错误上，而不是 Pod 直接
            # CreateContainerConfigError（secrets.yaml 模板已含这两键占位）。
            - name: CDS_COLUMN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_COLUMN_ENCRYPTION_KEY
                  optional: true
            - name: CDS_MFA_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_MFA_SECRET_ENCRYPTION_KEY
                  optional: true
          envFrom:
            # A302: 生产启动姿态（validate_security_config 的四个 boot gate）集中在
            # ConfigMap，保证 k8s 与 prod compose / helm values / remote_deploy.sh 不漂移。
            - configMapRef:
                name: cds-app-env
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          # A302/A285: 代码声明的运行时写入路径全部落卷。之前本 Deployment 一个 volume
          # 都没有，所有写入只存在于容器可写层，pod 重建即丢：会话工作区、对象存储
          # 本地原件（库里 ready 指向空盘）、出口审计（retention 0=永久，丢盘=审计断链）、
          # 共享卷根、Cube 结果目录。路径与 prod compose 的六个卷一致。
          volumeMounts:
            - name: api-sandbox
              mountPath: /tmp/cds-sandbox
            - name: api-sandbox-l0
              mountPath: /tmp/cds-sandbox-l0
            - name: api-storage
              mountPath: /tmp/cds-storage
            - name: api-egress-audit
              mountPath: /data/egress-audit
            - name: api-shared-volumes
              mountPath: /data/shared-volumes
            - name: api-cube-results
              mountPath: /var/lib/cds/sandbox-results
            - name: api-kms-master
              mountPath: /var/lib/cds-kms
      volumes:
        - name: api-sandbox
          persistentVolumeClaim:
            claimName: cds-api-sandbox-pvc
        - name: api-sandbox-l0
          persistentVolumeClaim:
            claimName: cds-api-sandbox-l0-pvc
        - name: api-storage
          persistentVolumeClaim:
            claimName: cds-api-storage-pvc
        - name: api-egress-audit
          persistentVolumeClaim:
            claimName: cds-api-egress-audit-pvc
        - name: api-shared-volumes
          persistentVolumeClaim:
            claimName: cds-api-shared-volumes-pvc
        - name: api-cube-results
          persistentVolumeClaim:
            claimName: cds-api-cube-results-pvc
        - name: api-kms-master
          persistentVolumeClaim:
            claimName: cds-api-kms-master-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cds-api
  namespace: cds-system
spec:
  selector:
    app: cds-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-frontend
  namespace: cds-system
  labels:
    app: cds-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cds-frontend
  template:
    metadata:
      labels:
        app: cds-frontend
    spec:
      containers:
        - name: cds-frontend
          image: cds-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cds-frontend
  namespace: cds-system
spec:
  selector:
    app: cds-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  type: NodePort
---
# A302: 生产启动姿态。本文件不设 CDS_DEBUG=true，Settings.DEBUG 默认 false，
# validate_security_config() 就把本路径当生产：四个开关留在代码默认值时它直接
# RAISE，cds-api 依旧在 k3s 上 CrashLoop。四个值与 docker-compose.prod.yml /
# helm values / remote_deploy.sh 逐字节一致（姿态同步是测试门）。
#
# 遗留要求（同一个 boot gate 集，不属于本门但是真约束）：生产姿态还要求
# cds-secrets 里提供 CDS_COLUMN_ENCRYPTION_KEY（16 字节，`openssl rand -hex 16`）
# 与 CDS_MFA_SECRET_ENCRYPTION_KEY；两者为空时 validate_security_config 仍然拒绝
# 启动 —— 密钥不能进 ConfigMap。2026-10-30 P6 起这两键已经在本文件 cds-api 的
# env 里以 secretKeyRef 正式接线（见上方注释），secrets.yaml 模板含占位。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cds-app-env
  namespace: cds-system
  labels:
    app: cds-api
data:
  CDS_DEBUG: "false"
  # P6 漂移收敛（2026-10-30）：CDS_LOG_JSON 单一真值源 = 生产姿态 "true"，
  # 与 docker-compose.prod.yml / helm values / remote_deploy.sh 同值（PROD_POSTURE 门钉）。
  CDS_LOG_JSON: "true"
  CDS_SECCOMP_FALLBACK_ALLOWED: "false"
  CDS_HSM_SOFTWARE_FALLBACK_ALLOWED: "false"
  CDS_SM3_FALLBACK_ALLOWED: "false"
  CDS_FEDERATION_JWT_KEY_REQUIRED: "true"
  # 2026-10-30 拍板（docs/retention.md）：janitor 真删主开关，生产默认关闭；
  # 白名单类别是 app/services/retention_janitor.py 的代码常量，audit_logs /
  # merkle_leaves / delivery_bundles / data_resources 永久硬拒，配置翻不动。
  CDS_JANITOR_ENABLED: "false"
  # P2-5（D-e2e-18）：MinIO 一致性巡检主闸，生产默认关（双门：此闸×interval>0）
  CDS_INTEGRITY_PATROL_ENABLED: "false"
  # P2-3 / D4（2026-11-05）：KMS 主密钥文件路径。默认启用：PVC cds-api-kms-master-pvc
  # 已挂在 /var/lib/cds-kms，卷在而不接线 = 「卷在证据蒸发」；DEK 已落库
  # （data_encryption_keys）而主密钥丢 = 全量密文陪葬。显式置 "" 退回旧行为；
  # 非空路径在生产由 validate_security_config 拒启校验（卷没挂上则拒启）。
  CDS_KMS_MASTER_KEY_FILE: "/var/lib/cds-kms/kms-master.key"
  # EGRESS 审计写方治理（波3补点）：代码默认 ENABLED=true 而 LOG_PATH=./logs/
  # cds-egress/（容器层）——本清单早已把 api-egress-audit PVC 挂在 /data/egress-audit，
  # 路径不接上就是「卷在证据蒸发」。补齐后与 prod compose/helm 两副本同姿态显式化。
  CDS_EGRESS_AUDIT_ENABLED: "true"
  CDS_EGRESS_AUDIT_LOG_PATH: /data/egress-audit/access.jsonl
---
# Prod 姿态下 main.py 跳过 create_all，schema 只能由 Alembic 建；没有这一步
# cds-api 会在空库上起来然后 500。与 deploy/e2e-remote/remote_deploy.sh 的
# “migrate schema” 步骤一致：只给 CDS_DATABASE_URL，跑 `alembic upgrade head`。
# `kubectl apply` 不重建已存在的 Job：重跑迁移请先 `kubectl delete job cds-migrate -n cds-system`。
apiVersion: batch/v1
kind: Job
metadata:
  name: cds-migrate
  namespace: cds-system
  labels:
    app: cds-migrate
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: cds-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: cds-api:latest
          imagePullPolicy: Never  # k3s 本地导入的镜像，同 cds-api Deployment
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: CDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_DATABASE_URL
            - name: CDS_DEBUG
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# A302: api 的六个运行时写入路径对应的 PVC（单节点 local-path + RWO +
# replicas:1 + strategy Recreate，三者互相成立）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-sandbox-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-sandbox-l0-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-storage-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# P2-3：KMS 主密钥文件持久化。env 空 = 卷空转零行为；1Gi 超配，真实占用一枚
# 主密钥文件。单副本 RWO 与上方 replicas=1/Recreate 纪律一致。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-kms-master-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# 出口审计日志：retention 0=永久，与其他卷不同，这里的丢失是不可逆的。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-egress-audit-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-shared-volumes-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cds-api-cube-results-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
