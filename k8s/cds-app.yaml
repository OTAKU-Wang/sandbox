apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-api
  namespace: cds-system
  labels:
    app: cds-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cds-api
  template:
    metadata:
      labels:
        app: cds-api
    spec:
      containers:
        - name: cds-api
          image: cds-api:latest
          imagePullPolicy: Never  # Use local k3s image
          ports:
            - containerPort: 8000
          env:
            - name: CDS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_DATABASE_URL
            - name: CDS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_REDIS_URL
            - name: CDS_VAULT_ADDR
              value: "http://vault:8200"
            - name: CDS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_VAULT_TOKEN
            - name: CDS_MINIO_ENDPOINT
              value: "minio:9000"
            - name: CDS_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_MINIO_ACCESS_KEY
            - name: CDS_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_MINIO_SECRET_KEY
            - name: CDS_CDC_KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_CDC_KAFKA_BROKERS
            - name: CDS_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_CLICKHOUSE_URL
            - name: CDS_OPA_URL
              value: "http://opa:8181"
            - name: CDS_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CDS_JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: cds-api
  namespace: cds-system
spec:
  selector:
    app: cds-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-frontend
  namespace: cds-system
  labels:
    app: cds-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cds-frontend
  template:
    metadata:
      labels:
        app: cds-frontend
    spec:
      containers:
        - name: cds-frontend
          image: cds-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cds-frontend
  namespace: cds-system
spec:
  selector:
    app: cds-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  type: NodePort
