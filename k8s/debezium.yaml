apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  namespace: cds-system
  labels:
    app: debezium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium
  template:
    metadata:
      labels:
        app: debezium
    spec:
      containers:
        - name: debezium
          image: debezium/connect:2.6
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: GROUP_ID
              value: "cds-cdc"
            - name: CONFIG_STORAGE_TOPIC
              value: "cds_connect_configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "cds_connect_offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "cds_connect_status"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: debezium
  namespace: cds-system
spec:
  selector:
    app: debezium
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
