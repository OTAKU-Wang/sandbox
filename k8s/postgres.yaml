apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cds-system
  labels:
    app: postgres
spec:
  replicas: 1
  # PVC 单例（local-path/RWO）：RollingUpdate 的 surge pod 永远卡在 ContainerCreating。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cds
            - name: POSTGRES_USER
              # P6 漂移收敛（2026-10-30）：应用用户单一真值源 = `cds`——与
              # scripts/init-db.sql(GRANT TO cds)、compose×3、两个 deploy 脚本、
              # helm bitnami auth.username 同值；旧的 cds_admin 是 k3s 路径孤儿漂移。
              # 存量 dev 卷（initdb 已跑过 cds_admin）升级前先执行：
              #   ALTER USER cds_admin RENAME TO cds;
              # 否则下面的 pg_isready 探针对旧卷必红。test_deploy_manifests 钉死同值。
              value: cds
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
          args:
            - postgres
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=1GB
            - -c
            - work_mem=16MB
            - -c
            - max_connections=200
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cds", "-d", "cds"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cds", "-d", "cds"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cds-system
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
