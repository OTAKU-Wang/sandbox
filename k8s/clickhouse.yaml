apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: cds-system
  labels:
    app: clickhouse
spec:
  replicas: 1
  # PVC 单例（local-path/RWO）：RollingUpdate 的 surge pod 永远卡在 ContainerCreating。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              value: cds_audit
            - name: CLICKHOUSE_USER
              value: cds_ch
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            # 旧 exec 探针的成败取决于 clickhouse-client 的隐式认证上下文（本文件只给
            # CLICKHOUSE_USER=cds_ch 设了密码，探针命令不带 -p，能否连上取决于镜像里
            # default 用户的本地免密约定）——就绪信号不该建立在这个无人控制的上下文上，
            # 而且每次探测都要建立一个服务端会话。/ping 是镜像文档化的免凭据健康端点。
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: chdata
          persistentVolumeClaim:
            claimName: chdata-pvc
        - name: init-sql
          configMap:
            name: clickhouse-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: cds-system
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chdata-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
