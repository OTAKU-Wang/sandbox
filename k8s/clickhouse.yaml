apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: cds-system
  labels:
    app: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              value: cds_audit
            - name: CLICKHOUSE_USER
              value: cds_ch
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cds-secrets
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["clickhouse-client", "--query", "SELECT 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: chdata
          persistentVolumeClaim:
            claimName: chdata-pvc
        - name: init-sql
          configMap:
            name: clickhouse-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: cds-system
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chdata-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
