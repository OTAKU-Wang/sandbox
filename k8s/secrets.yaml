# ⚠️ DEV ONLY — TEMPLATE — DO NOT USE IN PRODUCTION
# 2026-10-30 P6 模板化：真实凭据值已从本文件剥离（历史版本的 DEV 口令曾提交
# 入库，git 历史剥离归发布负责人；无论是否剥离，这些历史值都必须视为已泄漏）。
# 现在所有凭据键都是 <REPLACE_ME_*> 占位符：
#   - k8s/deploy.sh 会原样 apply 本文件；postgres/redis/minio 与 cds-api 读的是
#     同一个 Secret，所以未替换时集群"内部自洽"可跑 DEV 冒烟——任何真实环境
#     必须先把全部 <REPLACE_ME_*> 换成随机值再 apply（或整体改用外部注入）。
#   - 生产 MUST 经 existingSecret / Vault / 外部 secret 管理注入，永不 apply
#     本文件。占位值一旦进入真实集群等同无凭据。
# Rotation: regenerate every value above with `openssl rand -hex 32` (or
# `openssl rand -base64 24` for a URL-safe token) and inject the result via
# `kubectl create secret generic cds-secrets --from-file=...` / an external
# secret manager — never by editing and re-committing this file.
# See specs/productization-deployment-runbook.md §"K8s manifests 与 Helm chart
# 的密钥边界". 键集与 helm values secrets.existingSecret 注释同步（P6 起 16 键）。
apiVersion: v1
kind: Secret
metadata:
  name: cds-secrets
  namespace: cds-system
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<REPLACE_ME_POSTGRES_PASSWORD>"
  REDIS_PASSWORD: "<REPLACE_ME_REDIS_PASSWORD>"
  MINIO_ROOT_USER: "<REPLACE_ME_MINIO_ROOT_USER>"
  MINIO_ROOT_PASSWORD: "<REPLACE_ME_MINIO_ROOT_PASSWORD>"
  VAULT_TOKEN: "<REPLACE_ME_VAULT_TOKEN>"
  CLICKHOUSE_PASSWORD: "<REPLACE_ME_CLICKHOUSE_PASSWORD>"
  # P6 漂移收敛（2026-10-30）：应用用户单一真值源 = cds（与 postgres.yaml、
  # configmaps GRANT、compose、helm、scripts/init-db.sql 同值）。
  CDS_DATABASE_URL: "postgresql+asyncpg://cds:<REPLACE_ME_POSTGRES_PASSWORD>@postgres:5432/cds"
  CDS_REDIS_URL: "redis://:<REPLACE_ME_REDIS_PASSWORD>@redis:6379/0"
  CDS_CLICKHOUSE_URL: "http://clickhouse:8123/cds_audit"
  CDS_JWT_SECRET_KEY: "<REPLACE_ME_JWT_SECRET_KEY>"
  CDS_VAULT_TOKEN: "<REPLACE_ME_VAULT_TOKEN>"
  CDS_MINIO_ACCESS_KEY: "<REPLACE_ME_MINIO_ROOT_USER>"
  CDS_MINIO_SECRET_KEY: "<REPLACE_ME_MINIO_ROOT_PASSWORD>"
  # P6（2026-10-30）boot 门位强制密钥正式入 Secret（cds-api env 已接
  # secretKeyRef；prod 姿态 validate_security_config 要求两键非空，空/占位
  # 值下 prod boot 直接拒启，属预期 fail-closed；dev 冒烟不受影响）。
  # 列级 DEK：16 字节，`openssl rand -hex 16`；MFA 主密钥：长随机串。
  CDS_COLUMN_ENCRYPTION_KEY: "<REPLACE_ME_COLUMN_ENCRYPTION_KEY>"
  CDS_MFA_SECRET_ENCRYPTION_KEY: "<REPLACE_ME_MFA_SECRET_ENCRYPTION_KEY>"
  CDS_CDC_KAFKA_BROKERS: "kafka:9092"
