apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: cds-system
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
            - name: VAULT_API_ADDR
              value: "http://vault:8200"
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          volumeMounts:
            - name: vaultdata
              mountPath: /vault/data
            - name: vault-config
              mountPath: /vault/config
              readOnly: true
          readinessProbe:
            exec:
              command: ["vault", "status", "-address=http://127.0.0.1:8200"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: vaultdata
          persistentVolumeClaim:
            claimName: vaultdata-pvc
        - name: vault-config
          configMap:
            name: vault-config
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: cds-system
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultdata-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: cds-system
data:
  vault.hcl: |
    ui = true
    disable_mlock = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }
