apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: cds-system
  labels:
    app: vault
spec:
  replicas: 1
  # PVC 单例（local-path/RWO）：RollingUpdate 的 surge pod 永远卡在 ContainerCreating。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
            - name: VAULT_API_ADDR
              value: "http://vault:8200"
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          volumeMounts:
            - name: vaultdata
              mountPath: /vault/data
            - name: vault-config
              mountPath: /vault/config
              readOnly: true
          # `vault status` exits 2 while the store is sealed, so a freshly scheduled
          # pod (sealed until scripts/vault-init.sh runs) was permanently Not Ready —
          # and the exec CLI also needs VAULT_ADDR inside the probe. /v1/sys/health is
          # the documented unauthenticated health endpoint: 429 = sealed (not ready),
          # 200 = active/standby and initialized, 501 = initialized=false (not ready).
          readinessProbe:
            # standbyok=true keeps an HA standby Ready; sealed/uninitialized stay not Ready.
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: vaultdata
          persistentVolumeClaim:
            claimName: vaultdata-pvc
        - name: vault-config
          configMap:
            name: vault-config
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: cds-system
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultdata-pvc
  namespace: cds-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: cds-system
data:
  vault.hcl: |
    ui = true
    disable_mlock = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }
